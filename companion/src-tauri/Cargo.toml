[package]
name = "companion"
version = "0.1.0"
description = "Phone Vault Companion: pairs with the phone over USB, quotes and broadcasts what the phone signs"
authors = ["Phone Vault"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# USB accessory protocol (libusb)
rusb = "0.9"
# Ethereum node access; rustls so the bundle carries no OpenSSL
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# independent verification of what the phone signed
sha3 = "0.10"
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
thiserror = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
